name: Release (one-click)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish. Blank = auto next patch over npm latest."
        required: false
        default: ""

concurrency:
  group: one-click-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: version
        run: |
          REQ="${{ inputs.version }}"
          if [ -n "$REQ" ]; then
            if ! echo "$REQ" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::version '$REQ' does not look like semver (x.y.z or x.y.z-prerelease)"
              exit 1
            fi
            echo "version=$REQ" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CUR="$(npm view billion-context version)"
          if [ -z "$CUR" ]; then
            echo "::error::cannot read the npm latest version of billion-context"
            exit 1
          fi
          V="$(node -p 'const p = process.argv[1].split("-")[0].split("."); p[2] = String(Number(p[2]) + 1); p.join(".")' "$CUR")"
          echo "auto-bumped $CUR -> $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Drift guard
        run: |
          MASTER_V="$(node -p "require('./package.json').version")"
          NPM_V="$(npm view billion-context version)"
          if [ "$MASTER_V" != "$NPM_V" ]; then
            echo "::error::master package.json ($MASTER_V) != npm latest ($NPM_V). Sync master with the last published release before one-click releasing."
            exit 1
          fi
          if [ "${{ steps.version.outputs.version }}" = "$NPM_V" ]; then
            echo "::error::$NPM_V is already published; pick a newer version"
            exit 1
          fi

      - name: Bump version
        run: |
          node -e '
            const fs = require("fs");
            const [oldV, newV] = process.argv.slice(1);
            for (const f of ["package.json", "package-lock.json"]) {
              const s = fs.readFileSync(f, "utf8");
              const needle = `"version": "${oldV}"`;
              const n = s.split(needle).length - 1;
              if (!n) { console.error(`version field not found in ${f}`); process.exit(1); }
              fs.writeFileSync(f, s.split(needle).join(`"version": "${newV}"`));
              console.log(`${f}: replaced ${n} occurrence(s)`);
            }
          ' "$(node -p "require('./package.json').version")" "${{ steps.version.outputs.version }}"

      - name: Verify bump diff
        run: |
          git add package.json package-lock.json
          CHANGED="$(git diff --cached --name-only)"
          EXPECT="package-lock.json
          package.json"
          if [ "$CHANGED" != "$EXPECT" ]; then
            echo "::error::bump touched unexpected files: $CHANGED"
            exit 1
          fi

      - name: Pre-flight gate
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Commit and push to master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VER="${{ steps.version.outputs.version }}"
          git commit -q -m "release v$VER"
          if git push -q origin HEAD:master; then
            echo "pushed release commit to master"
            exit 0
          fi
          echo "::error::direct push to master was blocked (branch protection). Fallback: opening a release PR."
          BR="$(date -u +%Y-%m-%d)_release-v${VER}"
          git push -q origin "HEAD:$BR"
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d "{\"title\":\"release v${VER}\",\"head\":\"${BR}\",\"base\":\"master\",\"body\":\"Auto-fallback from the one-click release workflow: direct push to master was blocked by branch protection. Merging this PR publishes via the standard release.yml flow.\\n\\n<!-- ework-agent-pr -->\"}"
          echo ""
          echo "::error::nothing was published. Merge the fallback PR to finish the release."
          exit 1

      - name: Check if prerelease
        id: pre
        run: |
          if echo "${{ steps.version.outputs.version }}" | grep -q '-'; then
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        run: |
          git tag "v${{ steps.version.outputs.version }}" || true
          git push origin "v${{ steps.version.outputs.version }}" || true

      - name: Publish
        run: npm publish --tag ${{ steps.pre.outputs.tag }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          LAST="$(git describe --tags --abbrev=0 2>/dev/null || echo "")"
          NOTES="$RUNNER_TEMP/release-notes.md"
          if [ -n "$LAST" ] && [ "$LAST" != "v$VER" ]; then
            {
              echo "## Changes since $LAST"
              echo ""
              git log --no-merges --pretty='- %s' "$LAST..HEAD~1"
            } > "$NOTES"
          else
            echo "- initial release" > "$NOTES"
          fi
          node -e '
            const fs = require("fs");
            const [notesFile, ver, prerelease, out] = process.argv.slice(1);
            const body = {
              tag_name: "v" + ver,
              name: "v" + ver,
              prerelease: prerelease === "true",
              body: fs.readFileSync(notesFile, "utf8").trim()
            };
            fs.writeFileSync(out, JSON.stringify(body));
          ' "$NOTES" "$VER" "${{ steps.pre.outputs.prerelease }}" "$RUNNER_TEMP/release.json"
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d @"$RUNNER_TEMP/release.json"
